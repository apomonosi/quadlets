---
- name: Converge
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Create podman group
      ansible.builtin.group:
        name: podman
        state: present
      become: true

    - name: Create podman user for rootless quadlets
      ansible.builtin.user:
        name: podman
        group: podman
        shell: /bin/bash
        create_home: true
        state: present
      become: true

    - name: Add test domains to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 sso.test.local grafana.test.local"
        state: present
      become: true

  vars_files:
    - vars/main.yml

  tasks:
    - name: Include | quadlets role
      ansible.builtin.include_role:
        name: "quadlets"

  post_tasks:
    - name: Verify pocket-id API connectivity
      ansible.builtin.include_role:
        name: quadlets
        tasks_from: pocket_id_bootstrap.yml

    - name: Provision OIDC clients and user groups
      ansible.builtin.include_role:
        name: quadlets
        tasks_from: pocket_id_clients.yml
...
