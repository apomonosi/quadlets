---
# vars file for quadlets
# Internal variables — do not override in host_vars or group_vars.

# Packages installed on RHEL/CentOS Stream targets.
__quadlets_packages_redhat:
  - podman
  - openssl
  - curl
  - rsyslog
  - setroubleshoot-server
  - policycoreutils-python-utils
  - container-selinux
  - systemd-container    # provides machinectl; required for user D-Bus session access
  - net-tools
  - bind-utils

# Podman secret names (in the quadlets user's secret store) for pocket-id keys.
__quadlets_pocket_id_secret_encryption_key: pocket-id-encryption-key
__quadlets_pocket_id_secret_static_api_key: pocket-id-static-api-key
# Per-service OIDC client secrets are named "<service name><suffix>".
__quadlets_oidc_secret_suffix: -oidc-client-secret

# SELinux booleans required for rootless container networking on RHEL.
__quadlets_sebooleans:
  - container_manage_cgroup
