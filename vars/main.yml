---
# vars file for quadlets
# Internal variables — do not override in host_vars or group_vars.

# Packages installed on RHEL/CentOS Stream targets.
__quadlets_packages_redhat:
  - podman
  - openssl
  - curl
  - rsyslog
  - setroubleshoot-server
  - policycoreutils-python-utils
  - container-selinux
  - net-tools
  - bind-utils

# SELinux booleans required for rootless container networking on RHEL.
__quadlets_sebooleans:
  - container_manage_cgroup
