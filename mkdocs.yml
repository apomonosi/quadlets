site_name: Quadlets — Podman Quadlet Services with SSO
site_description: >
  Ansible role for deploying rootless Podman quadlet services
  behind nginx-proxy with pocket-id OIDC/SSO on RHEL/CentOS Stream.
site_author: Lars Melwyn Jensen

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - About: about.md
  - Services:
      - Audiobookshelf: services/audiobookshelf.md
      - BookStack: services/bookstack.md
      - GitLab: services/gitlab.md
      - Grafana: services/grafana.md
      - Immich: services/immich.md
      - Komodo: services/komodo.md
      - Open WebUI: services/openwebui.md
      - Vaultwarden: services/vaultwarden.md
  - Changelog: changelog.md
