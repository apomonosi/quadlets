---
# tasks/cert_mkcert.yml — Generate a locally-trusted cert with mkcert
# Input variables: _cert_virtual_host
#
# mkcert -install is intentionally NOT used here. It calls `sudo tee` internally
# to copy the root CA to /etc/pki/ca-trust/, which hangs in a non-TTY Ansible
# run waiting for a sudo password. Instead we:
#   1. Generate the cert as the quadlets_user (mkcert auto-creates the CA on
#      first run and stores it under _mkcert_caroot).
#   2. Copy rootCA.pem to the system trust anchors directory as root.
#   3. Run update-ca-trust as root (handler) only when the CA file changed.

- name: Mkcert | Check if binary is already installed
  ansible.builtin.stat:
    path: "{{ quadlets_mkcert_install_dir }}/mkcert"
  register: _mkcert_stat

- name: Mkcert | Resolve system architecture label
  ansible.builtin.set_fact:
    _mkcert_arch: >-
      {{ 'amd64' if ansible_architecture == 'x86_64'
         else 'arm64' if ansible_architecture == 'aarch64'
         else ansible_architecture }}

- name: Mkcert | Download mkcert binary
  ansible.builtin.get_url:
    url: >-
      https://github.com/FiloSottile/mkcert/releases/download/{{ quadlets_mkcert_version
      }}/mkcert-{{ quadlets_mkcert_version }}-linux-{{ _mkcert_arch }}
    dest: "{{ quadlets_mkcert_install_dir }}/mkcert"
    mode: "0755"
  become: true
  when: not _mkcert_stat.stat.exists

- name: "Mkcert | Generate certificate for {{ _cert_virtual_host }}"
  ansible.builtin.command:
    argv:
      - "{{ quadlets_mkcert_install_dir }}/mkcert"
      - "-cert-file"
      - "{{ _quadlets_certs_dir }}/{{ _cert_virtual_host }}.crt"
      - "-key-file"
      - "{{ _quadlets_certs_dir }}/{{ _cert_virtual_host }}.key"
      - "{{ _cert_virtual_host }}"
    creates: "{{ _quadlets_certs_dir }}/{{ _cert_virtual_host }}.crt"
  environment:
    HOME: "/home/{{ quadlets_user }}"
    CAROOT: "{{ _mkcert_caroot }}"
  become: true
  become_user: "{{ quadlets_user }}"

# Copy the CA cert directly as root — avoids the sudo-inside-mkcert problem.
- name: Mkcert | Copy local CA to system trust anchors
  ansible.builtin.copy:
    src: "{{ _mkcert_caroot }}/rootCA.pem"
    dest: /etc/pki/ca-trust/source/anchors/mkcert-rootCA.pem
    remote_src: true
    mode: "0644"
  become: true
  notify: update ca trust
