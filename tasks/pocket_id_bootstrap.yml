---
# tasks/pocket_id_bootstrap.yml — Verify pocket-id API connectivity
#
# pocket-id uses WebAuthn passkeys for authentication — there is no email/password
# sign-in endpoint. The recommended automation path is to set STATIC_API_KEY in the
# container environment (via quadlets_pocket_id_static_api_key), which pocket-id
# accepts via the X-API-Key header with no browser session required.
#
# This task verifies that the configured API key works. Run it once after deploying
# pocket-id to confirm the stack is reachable and the key is valid.
#
# Usage: ansible-playbook site.yml --tags pocket_id_bootstrap
#
# Prerequisites:
#   1. quadlets_pocket_id_static_api_key is set in the container (and matches
#      quadlets_pocket_id_api_key used here).
#   2. Complete the pocket-id first-run setup in the browser (create your admin
#      passkey at {{ quadlets_pocket_id_issuer_url }}).

- name: Bootstrap | Resolve effective API key
  ansible.builtin.set_fact:
    _pocket_id_effective_api_key: >-
      {{ quadlets_pocket_id_api_key
         if quadlets_pocket_id_api_key | length > 0
         else quadlets_pocket_id_static_api_key }}

- name: Bootstrap | Assert an API key is configured
  ansible.builtin.assert:
    that:
      - _pocket_id_effective_api_key | length > 0
    fail_msg: >
      Set quadlets_pocket_id_static_api_key (preferred) or quadlets_pocket_id_api_key
      before running the pocket_id_bootstrap tag.

- name: Bootstrap | Wait for pocket-id to become reachable
  ansible.builtin.uri:
    url: "{{ quadlets_pocket_id_issuer_url }}/healthz"
    method: GET
    status_code: [200, 204]
    validate_certs: "{{ quadlets_cert_mode != 'mkcert' }}"
  register: _pocket_id_health
  until: _pocket_id_health.status in [200, 204]
  retries: 30
  delay: 5

- name: Bootstrap | Verify API key by listing OIDC clients
  ansible.builtin.uri:
    url: "{{ quadlets_pocket_id_issuer_url }}/api/oidc/clients"
    method: GET
    headers:
      X-API-Key: "{{ _pocket_id_effective_api_key }}"
    status_code: [200]
    validate_certs: "{{ quadlets_cert_mode != 'mkcert' }}"
  register: _pocket_id_key_check
  no_log: true

- name: Bootstrap | Confirm API access
  ansible.builtin.debug:
    msg: |
      ============================================================
      pocket-id is reachable and the API key is valid.

      OIDC clients currently registered: {{ _pocket_id_key_check.json.pagination.totalItems }}

      Next steps (if not done yet):
        1. Open {{ quadlets_pocket_id_issuer_url }} in your browser.
        2. Complete the first-run setup to create your admin passkey.
        3. Run --tags pocket_id_clients to provision OIDC clients and groups.
      ============================================================
