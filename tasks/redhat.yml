---
# tasks/redhat.yml — RHEL / CentOS Stream specific setup

- name: RedHat | Install required packages
  ansible.builtin.package:
    name: "{{ __quadlets_packages_redhat }}"
    state: present
  become: true

- name: RedHat | Set SELinux booleans for container operation
  ansible.posix.seboolean:
    name: "{{ item }}"
    state: true
    persistent: true
  loop: "{{ __quadlets_sebooleans }}"
  become: true
  when: ansible_facts.selinux.status | default('disabled') == 'enabled'
