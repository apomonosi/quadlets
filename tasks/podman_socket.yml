---
# tasks/podman_socket.yml — Activate the rootless Podman socket for docker-gen

- name: Podman socket | Enable and start podman.socket user unit
  ansible.builtin.systemd:
    name: podman.socket
    enabled: true
    state: started
    scope: user
  become: true
  become_user: "{{ quadlets_user }}"
  environment:
    XDG_RUNTIME_DIR: "{{ _quadlets_runtime_dir }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path={{ _quadlets_runtime_dir }}/bus"

# wait_for does not support become, so root would get Permission denied when
# trying to stat inside the user's private runtime directory under SELinux.
# Use stat with become_user so the check runs as the podman user instead.
- name: Podman socket | Wait for socket file to appear
  ansible.builtin.stat:
    path: "{{ _podman_socket_path }}"
  register: _socket_stat
  until: _socket_stat.stat.exists | default(false)
  retries: 15
  delay: 1
  become: true
  become_user: "{{ quadlets_user }}"
