---
# tasks/network.yml — Deploy shared Podman network quadlet

- name: Network | Template {{ quadlets_network_name }}.network quadlet unit
  ansible.builtin.template:
    src: quadlet/proxy.network.j2
    dest: "{{ _quadlets_systemd_dir }}/{{ quadlets_network_name }}.network"
    owner: "{{ quadlets_user }}"
    group: "{{ quadlets_group }}"
    mode: "0640"
  become: true
  notify: reload user systemd daemon
