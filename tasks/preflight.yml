---
# tasks/preflight.yml — Pre-flight checks, UID detection, and directory setup

- name: Preflight | Detect UID for quadlets_user
  ansible.builtin.getent:
    database: passwd
    key: "{{ quadlets_user }}"
  register: _quadlets_getent
  become: true

- name: Preflight | Set quadlets_uid from passwd entry
  ansible.builtin.set_fact:
    quadlets_uid: "{{ _quadlets_getent.ansible_facts.getent_passwd[quadlets_user][1] }}"
  when: quadlets_uid == ""

- name: Preflight | Compute derived path facts
  ansible.builtin.set_fact:
    _quadlets_runtime_dir: "/run/user/{{ quadlets_uid }}"
    _quadlets_systemd_dir: >-
      {{ quadlets_systemd_dir if quadlets_systemd_dir != ''
         else '/home/' + quadlets_user + '/.config/containers/systemd' }}
    _quadlets_data_base_dir: >-
      {{ quadlets_data_base_dir if quadlets_data_base_dir != ''
         else '/home/' + quadlets_user + '/.local/share' }}
    # nginx-proxy configuration tree lives under ~/.config/nginx-proxy/
    # matching the %E/nginx-proxy/ specifier used in the quadlet unit file.
    _quadlets_nginx_proxy_config_dir: "/home/{{ quadlets_user }}/.config/nginx-proxy"

- name: Preflight | Set socket, cert, and data directory facts
  ansible.builtin.set_fact:
    _podman_socket_path: "/run/user/{{ quadlets_uid }}/podman/podman.sock"
    _quadlets_pocket_id_data_dir: "{{ _quadlets_data_base_dir }}/pocket-id"
    _mkcert_caroot: "/home/{{ quadlets_user }}/.local/share/mkcert"
    # Certs sit inside the nginx-proxy config tree so they match the container
    # bind-mount path (%E/nginx-proxy/certs). Override quadlets_certs_dir to
    # place them elsewhere.
    _quadlets_certs_dir: >-
      {{ quadlets_certs_dir if quadlets_certs_dir != ''
         else '/home/' + quadlets_user + '/.config/nginx-proxy/certs' }}

- name: Preflight | Validate required fields on each service entry
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.image is defined
      - item.virtual_host | default('') | length == 0 or item.port is defined
    fail_msg: >
      Service entry needs name and image, plus port when virtual_host is set
      (entries without virtual_host are internal-only): {{ item | to_json }}
  loop: "{{ quadlets_services }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"

- name: Preflight | Validate pocket-id keys
  ansible.builtin.assert:
    that:
      - quadlets_pocket_id_encryption_key | length >= 16
      - quadlets_pocket_id_static_api_key | length == 0 or
        quadlets_pocket_id_static_api_key | length >= 16
    fail_msg: >
      pocket-id requires quadlets_pocket_id_encryption_key (>= 16 chars), and
      quadlets_pocket_id_static_api_key must be empty or >= 16 chars.
      Generate values with `openssl rand -base64 32` and store them in Ansible Vault.
  when: quadlets_pocket_id_enabled | bool

- name: Preflight | Create quadlet systemd unit directory
  ansible.builtin.file:
    path: "{{ _quadlets_systemd_dir }}"
    state: directory
    owner: "{{ quadlets_user }}"
    group: "{{ quadlets_group }}"
    mode: "0750"
  become: true

- name: Preflight | Create nginx-proxy config directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ quadlets_user }}"
    group: "{{ quadlets_group }}"
    mode: "0750"
  loop:
    - "{{ _quadlets_nginx_proxy_config_dir }}"
    - "{{ _quadlets_nginx_proxy_config_dir }}/certs"
    - "{{ _quadlets_nginx_proxy_config_dir }}/vhost.d"
    - "{{ _quadlets_nginx_proxy_config_dir }}/conf.d"
  become: true
  when: quadlets_nginx_proxy_enabled | bool

- name: Preflight | Create pocket-id data directory
  ansible.builtin.file:
    path: "{{ _quadlets_pocket_id_data_dir }}"
    state: directory
    owner: "{{ quadlets_user }}"
    group: "{{ quadlets_group }}"
    mode: "0750"
  become: true
  when: quadlets_pocket_id_enabled | bool
