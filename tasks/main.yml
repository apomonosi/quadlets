---
# tasks file for quadlets

- name: Include OS-specific setup
  ansible.builtin.import_tasks: redhat.yml
  when: ansible_os_family == "RedHat"
  tags: always

- name: Preflight checks and directory setup
  ansible.builtin.import_tasks: preflight.yml
  tags: always

- name: Enable systemd user lingering
  ansible.builtin.import_tasks: lingering.yml
  tags:
    - infrastructure
    - lingering

- name: Enable rootless Podman socket
  ansible.builtin.import_tasks: podman_socket.yml
  tags:
    - infrastructure
    - podman_socket

- name: Deploy shared proxy network quadlet
  ansible.builtin.import_tasks: network.yml
  tags:
    - infrastructure
    - network

- name: Provision TLS certificates
  ansible.builtin.import_tasks: certificates.yml
  tags:
    - infrastructure
    - certificates

- name: Deploy nginx-proxy quadlet
  ansible.builtin.import_tasks: nginx_proxy.yml
  when: quadlets_nginx_proxy_enabled | bool
  tags:
    - infrastructure
    - nginx_proxy

- name: Deploy pocket-id quadlet
  ansible.builtin.import_tasks: pocket_id.yml
  when: quadlets_pocket_id_enabled | bool
  tags:
    - infrastructure
    - pocket_id

- name: Verify pocket-id API connectivity
  ansible.builtin.import_tasks: pocket_id_bootstrap.yml
  when:
    - quadlets_pocket_id_enabled | bool
    - (quadlets_pocket_id_api_key | length > 0) or
      (quadlets_pocket_id_static_api_key | length > 0)
  tags:
    - never
    - pocket_id_bootstrap

- name: Register OIDC clients in pocket-id
  ansible.builtin.import_tasks: pocket_id_clients.yml
  when:
    - quadlets_pocket_id_enabled | bool
    - quadlets_pocket_id_provision_clients | bool
    - (quadlets_pocket_id_api_key | length > 0) or
      (quadlets_pocket_id_static_api_key | length > 0)
  tags:
    - never
    - pocket_id_clients

- name: Deploy service quadlets
  ansible.builtin.import_tasks: services.yml
  when: quadlets_services | length > 0
  tags:
    - services

- name: Final systemd sync and service start
  ansible.builtin.import_tasks: systemd_reload.yml
  tags: always
