---
# defaults file for quadlets

# ── Legacy skeleton variables ─────────────────────────────────────────────────
quadlets_type: "proxy_sso"
quadlets_profile: ""

# ── System identity ───────────────────────────────────────────────────────────
# OS user who owns all rootless Podman quadlet units.
# This user must exist on the target host before the role runs.
quadlets_user: "podman"
quadlets_group: "podman"
# UID is detected automatically via getent; override if detection is unreliable.
quadlets_uid: ""

# ── Derived paths ─────────────────────────────────────────────────────────────
# Leave empty to use defaults derived from quadlets_user home directory.
#   quadlets_systemd_dir   → /home/<user>/.config/containers/systemd
#   quadlets_data_base_dir → /home/<user>/.local/share
# Certificates live under the nginx-proxy config tree:
#   quadlets_certs_dir     → /home/<user>/.config/nginx-proxy/certs
quadlets_systemd_dir: ""
quadlets_certs_dir: ""
quadlets_data_base_dir: ""

# ── Shared Podman network ─────────────────────────────────────────────────────
quadlets_network_name: "proxy"
quadlets_network_subnet: "10.89.0.0/24"
quadlets_network_gateway: "10.89.0.1"

# ── nginx-proxy ───────────────────────────────────────────────────────────────
quadlets_nginx_proxy_enabled: true
quadlets_nginx_proxy_image: "docker.io/jwilder/nginx-proxy:latest"
quadlets_nginx_proxy_http_port: "80"
quadlets_nginx_proxy_https_port: "443"
quadlets_nginx_proxy_https_method: "redirect"
quadlets_nginx_proxy_read_timeout: "600"
quadlets_nginx_proxy_connect_timeout: "600"
# Additional environment variables for the nginx-proxy container.
quadlets_nginx_proxy_extra_env: {}
# Set true to populate conf.d/custom.conf from templates/nginx/custom.conf.j2.
# The file is always mounted; this flag controls whether a template is applied.
quadlets_nginx_proxy_custom_conf: false

# ── pocket-id SSO ─────────────────────────────────────────────────────────────
quadlets_pocket_id_enabled: true
quadlets_pocket_id_image: "ghcr.io/stonith404/pocket-id:latest"
# FQDN under which pocket-id is reachable through nginx-proxy.
quadlets_pocket_id_virtual_host: "sso.example.com"
# Public OIDC issuer URL used by services for endpoint discovery.
quadlets_pocket_id_issuer_url: "https://{{ quadlets_pocket_id_virtual_host }}"
# Additional environment variables for the pocket-id container.
quadlets_pocket_id_extra_env: {}

# Static API key injected into the pocket-id container as STATIC_API_KEY env var.
# pocket-id accepts this value via X-API-Key header without any browser session.
# Minimum 16 characters. Store in Ansible Vault. Leave empty to skip injection.
# When set, this value is automatically used as quadlets_pocket_id_api_key below
# if that variable is left empty.
quadlets_pocket_id_static_api_key: ""

# API key for pocket-id REST API calls from Ansible.
# Set this to the same value as quadlets_pocket_id_static_api_key, or to a
# separately created API key from the pocket-id UI.
# Required when quadlets_pocket_id_provision_clients: true.
quadlets_pocket_id_api_key: ""

# Verify API connectivity and key validity (run once after first deploy).
# Use: ansible-playbook ... --tags pocket_id_bootstrap
quadlets_pocket_id_bootstrap: false

# Automatically register OIDC clients and user groups via the pocket-id API.
# Requires quadlets_pocket_id_api_key (or quadlets_pocket_id_static_api_key) to be set.
# Use: ansible-playbook ... --tags pocket_id_clients
quadlets_pocket_id_provision_clients: false

# ── Certificates ──────────────────────────────────────────────────────────────
# Certificate mode for SSL termination at nginx-proxy.
#   "mkcert"  — generate locally-trusted certs via mkcert (development/staging)
#   "byo"     — copy pre-existing certs from controller paths (production)
quadlets_cert_mode: "mkcert"

# mkcert options (used when quadlets_cert_mode == "mkcert")
quadlets_mkcert_version: "v1.4.4"
quadlets_mkcert_install_dir: "/usr/local/bin"

# BYO certificate global fallback paths (controller-side paths for ansible.builtin.copy).
# Individual services can override via byo_cert_src / byo_key_src in their service dict.
quadlets_byo_cert_src: ""
quadlets_byo_key_src: ""

# ── Services ──────────────────────────────────────────────────────────────────
# List of service containers to deploy behind nginx-proxy.
# Full schema and per-service examples in README.md and docs/services/.
#
# Required keys per service:
#   name         — systemd unit name (e.g. "nextcloud")
#   image        — container image (e.g. "nextcloud:29")
#   virtual_host — FQDN routed by nginx-proxy (e.g. "nextcloud.example.com")
#   port         — internal container port nginx-proxy proxies to
#
# Optional keys:
#   oidc_client_id      — OIDC client ID registered in pocket-id
#   oidc_client_secret  — OIDC client secret (Vault-encrypt!)
#   oidc_issuer_url     — override OIDC issuer (default: quadlets_pocket_id_issuer_url)
#   pocket_id_group     — pocket-id user group name for this service
#   callback_urls       — redirect URIs for pocket-id client registration
#   pkce_enabled        — enable PKCE for this OIDC client (default: true)
#   volumes             — list of "host:container[:options]" volume strings
#   env                 — dict of extra environment variables
#   cert_mode           — per-service cert mode override (default: quadlets_cert_mode)
#   byo_cert_src        — per-service BYO cert path override
#   byo_key_src         — per-service BYO key path override
#   depends_on          — list of other unit names to add After=/Requires=
#   extra_labels        — dict of additional container labels
quadlets_services: []
